<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Fundación Lucky</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="login-body">
    <div class="login-layout">
        
        <!-- Left Column (Image) -->
        <div class="login-left">
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600&h=800&fit=crop" alt="Gatito lindo" class="register-img">
        </div>

        <!-- Right Column (Form Area) -->
        <div class="login-right register-right">

            <div class="login-content-wrapper">
                <h2 class="login-title">Crear Cuenta</h2>
                
                <div class="login-form-box">
                    <form action="#" method="POST" class="login-form">
                        <input type="text" placeholder="Nombre y Apellido:" class="login-input" required>
                        <input type="email" placeholder="Correo electrónico:" class="login-input" required>
                        <input type="password" placeholder="Contraseña:" class="login-input" required>
                        <input type="password" placeholder="Confirmar contraseña:" class="login-input" required>
                        
                        <!-- Actions inside the grey box -->
                        <div class="register-actions">
                            <button type="submit" class="btn-login-submit">Registrarme</button>
                            <p class="register-text">¿Ya tienes cuenta? <a href="login.html">Iniciar Sesión</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
