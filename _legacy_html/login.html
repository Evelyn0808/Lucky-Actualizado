<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Fundación Lucky</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="login-body">
    <div class="login-layout">
        
        <!-- Left Column (Image) -->
        <div class="login-left">
            <img src="https://placedog.net/600/800?id=25" alt="Perrito en fondo blanco">
        </div>

        <!-- Right Column (Form Area) -->
        <div class="login-right">
            <div class="login-content-wrapper">
                <h2 class="login-title">Iniciar Sesión</h2>
                
                <div class="login-form-box">
                    <form action="#" method="POST" class="login-form">
                        <input type="email" placeholder="Correo electronico:" class="login-input" required>
                        <input type="password" placeholder="Contraseña:" class="login-input" required>
                        <input type="password" placeholder="Repetir contraseña:" class="login-input" required>
                    </form>
                </div>
                
                <div class="login-actions">
                    <a href="#" class="forgot-password">¿Olvidaste la contraseña?</a>
                    <button type="submit" class="btn-login-submit">Iniciar sesión</button>
                    <p class="register-text">¿No tienes cuenta? <a href="#">Registrate</a></p>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
